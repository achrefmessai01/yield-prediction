stages:
  - test

# Only build commits pushed to a branch that has an open merge request.
# Skip entirely when the commit title starts with "wip".
workflow:
  rules:
    - if: $CI_COMMIT_TITLE =~ /^wip/i
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

default:
  image: python:3.12-slim
  interruptible: true  # let a newer push cancel an in-flight run

tests:
  stage: test
  before_script:
    - pip install "poetry>=2,<3"
    - poetry install
  script:
    - poetry run python -m unittest discover